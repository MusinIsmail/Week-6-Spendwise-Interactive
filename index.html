<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise - Interactive Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>💳 SpendWise</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link active">Overview</a>
        <a href="#" class="nav-link">Expenses</a>
        <a href="#" class="nav-link">Budgets</a>
        <a href="#" class="nav-link">Analytics</a>
      </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Header -->
      <header class="header">
        <div>
          <h1>Financial Dashboard</h1>
          <p class="subtitle">Interactive Expense Tracker & Budget Manager</p>
        </div>
        <div class="user-profile">Musin Ismail</div>
      </header>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Live Budget Banner & Summary Cards -->
        <section class="summary-section">
          <div class="summary-card">
            <span class="summary-label">Monthly Budget</span>
            <span class="summary-value" id="display-budget">$0.00</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Total Spent</span>
            <span class="summary-value" id="display-total-spent">$0.00</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Remaining Balance</span>
            <span class="summary-value" id="display-remaining">$0.00</span>
          </div>
        </section>

        <!-- Dynamic Feedback Alert Banner -->
        <div id="status-alert" class="alert-banner"></div>

        <!-- Add Expense Interactive Form -->
        <section class="form-section">
          <h2>Add New Expense Record</h2>
          <form id="expense-form" class="expense-form">
            <div class="form-group">
              <label for="expense-title">Expense Title</label>
              <input type="text" id="expense-title" placeholder="e.g., Groceries" required />
            </div>
            <div class="form-group">
              <label for="expense-amount">Amount ($)</label>
              <input type="number" id="expense-amount" placeholder="e.g., 150" step="0.01" min="0.01" required />
            </div>
            <div class="form-group">
              <label for="expense-category">Category Icon</label>
              <select id="expense-category" required>
                <option value="🍔 Food & Dining">🍔 Food & Dining</option>
                <option value="🚗 Transportation">🚗 Transportation</option>
                <option value="🏠 Rent & Housing">🏠 Rent & Housing</option>
                <option value="🎬 Entertainment">🎬 Entertainment</option>
                <option value="⚡ Utilities">⚡ Utilities</option>
                <option value="🛒 Shopping">🛒 Shopping</option>
              </select>
            </div>
            <button type="submit" class="btn-submit">Add Expense</button>
          </form>
        </section>

        <!-- Dynamic Expenses Grid -->
        <section class="records-section">
          <h2>Active Category Records</h2>
          <div id="cards-grid" class="cards-grid">
            <!-- Cards will be populated dynamically via script.js -->
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
